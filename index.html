<title>بنك أسئلة السمنار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a single exam sheet column — header strip, topic filter, one question card at a time, results sheet at the end */
:root{
  --paper:#F2F5F7; --sheet:#FFFFFF; --ink:#16232F; --muted:#5B6B78; --line:#D8E0E6;
  --accent:#1D5C7A; --accent-soft:#E3EEF4;
  --ok:#1E7A4F; --ok-soft:#E1F3E9; --bad:#B3261E; --bad-soft:#FBE7E5;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F171D; --sheet:#17222B; --ink:#E6EDF2; --muted:#93A3AF; --line:#2A3945;
  --accent:#6FB3D4; --accent-soft:#1C3442; --ok:#5FCB94; --ok-soft:#15352A; --bad:#F08A80; --bad-soft:#3A1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F171D; --sheet:#17222B; --ink:#E6EDF2; --muted:#93A3AF; --line:#2A3945;
  --accent:#6FB3D4; --accent-soft:#1C3442; --ok:#5FCB94; --ok-soft:#15352A; --bad:#F08A80; --bad-soft:#3A1E1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,34px);line-height:1.3;margin:0;text-wrap:balance}
.meta{font-size:14px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.setup{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.setup .row{display:flex;flex-direction:column;gap:8px}
.setup .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.num{font:inherit;width:84px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.num:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.avail{font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.score b{color:var(--ok)} .score s{text-decoration:none;color:var(--bad);font-weight:700}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:4px;font-weight:600}
.q{font-size:19px;font-weight:600;line-height:1.65;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:right;display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.exp{border-right:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:4px;font-size:15px}
.exp strong{display:block;font-size:13px;color:var(--accent)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 20px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;gap:10px}
.big{font-family:var(--display);font-size:56px;line-height:1.1;font-variant-numeric:tabular-nums}
.grade{font-weight:600}
.result .actions{justify-content:center}
.note{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header>
    <span class="eyebrow">كلية التربية · مقرر سمنار التنمية المهنية</span>
    <h1>بنك أسئلة السمنار</h1>
    <span class="meta" id="meta"></span>
  </header>

  <section class="setup" aria-label="إعداد الاختبار">
    <div class="row">
      <span class="lbl">الموضوع</span>
      <div class="filters" role="group" aria-label="اختيار الموضوع">
        <button class="chip" data-t="0" aria-pressed="true">كل المواضيع</button>
        <button class="chip" data-t="1" aria-pressed="false">١ · مهنة التعليم ومكانة المعلم</button>
        <button class="chip" data-t="2" aria-pressed="false">٢ · تكوين المعلم</button>
        <button class="chip" data-t="3" aria-pressed="false">٣ · التنمية المهنية</button>
      </div>
    </div>
    <div class="row">
      <label class="lbl" for="cnt">عدد الأسئلة</label>
      <div class="counts" role="group" aria-label="عدد الأسئلة">
        <button class="chip cn" data-n="10" aria-pressed="false">١٠</button>
        <button class="chip cn" data-n="20" aria-pressed="true">٢٠</button>
        <button class="chip cn" data-n="30" aria-pressed="false">٣٠</button>
        <button class="chip cn" data-n="50" aria-pressed="false">٥٠</button>
        <button class="chip cn" data-n="0" aria-pressed="false">الكل</button>
        <input class="num" id="cnt" type="number" inputmode="numeric" min="1" value="20" aria-label="عدد مخصص">
      </div>
    </div>
    <div class="go">
      <span class="avail" id="avail"></span>
      <button class="btn" id="start">ابدأ الاختبار</button>
    </div>
  </section>

  <div class="status">
    <span id="pos"></span>
    <div class="bar"><i id="fill"></i></div>
    <span class="score">صح <b id="ok">0</b> · خطأ <s id="bad">0</s></span>
  </div>

  <section class="card" id="card" aria-live="polite"></section>
  <p class="note">الخيارات والأسئلة تُخلط في كل محاولة، فلا تحفظ موضع الإجابة.</p>
</div>

<script>
const T={1:"مهنة التعليم",2:"تكوين المعلم",3:"التنمية المهنية"};
// [topic, question, [correct, wrong, wrong, wrong], explanation]
const Q=[
[1,"الحرفة عمل:",["يكتسبه الفرد بسنوات الخبرة دون اشتراط مستوى ثقافي","يتطلب إعداداً جامعياً طويلاً","يخضع صاحبه لميثاق شرف ملزم","لا يُمارَس إلا بترخيص رسمي"],"الحرفة لا تشترط مستوى ثقافياً، وتُكتسب بالخبرة، وتعتمد على عمل يدوي أو فكري بسيط."],
[1,"تعتمد الحرفة غالباً على:",["العمل اليدوي أو الفكري البسيط","المعارف المتخصصة العالية","النظريات العلمية","التدريب أثناء الخدمة"],"هذا ما يميزها عن المهنة القائمة على معارف متخصصة."],
[1,"من سمات المهنة أنها تتطلب:",["قدراً من المعارف المتخصصة لا يأتي غالباً إلا بإعداد جامعي","خبرة عملية فقط دون تعليم","مستوى تعليمياً أساسياً","عملاً يدوياً منظماً"],"المهنة تتطلب إعداداً تعليمياً عالياً وطويلاً، وهو المستوى الجامعي."],
[1,"الحكم على عمل ما بأنه مهنة مرهون بـ:",["توافر معظم أو كل معايير المهنة فيه","توافر معيار واحد منها","اعتراف الدولة به فقط","ارتفاع دخل صاحبه"],"يكفي توافر معظم المعايير أو كلها."],
[1,"يُعد التعليم مهنة لأن:",["معظم معايير المهنة تنطبق عليه","أي فرد يستطيع ممارسته","يعتمد على الخبرة وحدها","لا يتطلب إعداداً جامعياً"],"التعليم مهنة لا حرفة لانطباق معظم معايير المهنة عليه."],
[1,"عدد معايير المهنة الواردة في المقرر:",["سبعة","خمسة","ثلاثة","عشرة"],"أهداف مجتمعية، معرفة نظرية، تأهيل، احتراف، نمو مهني، تنظيم، أخلاق."],
[1,"المعيار الذي يعني أن المهنة مصدر دخل صاحبها لا مجرد هواية:",["الاحتراف المهني المنظم","التأهيل المهني","التنظيم المهني","النمو المهني"],"من يحترف المهنة لا يمارسها لأنه يهواها فقط، بل لأنها تكسبه العيش."],
[1,"ميثاق شرف المهنة يندرج تحت معيار:",["الأخلاق المهنية","التنظيم المهني","الأهداف المجتمعية","التأهيل المهني"],"تشترط المهنة أخلاقاً مهنية تُعرف بميثاق شرف المهنة."],
[1,"قد يصل جزاء الإخلال الكبير بميثاق شرف المهنة إلى:",["الحرمان والعزل من عضوية المهنة","الإنذار الشفهي فقط","خصم جزء من الراتب","النقل إلى مدرسة أخرى"],"أقصى جزاء ذكره المقرر هو الحرمان والعزل من العضوية."],
[1,"متابعة أصحاب المهنة لأحدث التطورات في تخصصهم عبر برامج التدريب تمثل معيار:",["النمو المهني أثناء الخدمة","التأهيل المهني","الاحتراف المنظم","التنظيم المهني"],"النمو المهني يكون أثناء الخدمة، أما التأهيل فقبلها."],
[1,"يتم التأهيل المهني غالباً داخل:",["الجامعات والمعاهد العليا","المدارس الثانوية","مراكز التدريب أثناء الخدمة","النقابات المهنية"],"إعداد ممتد في الجامعات والمعاهد العليا ينتهي بشهادة أو ترخيص."],
[1,"تحديد أهداف المهنة وضبط ممارسات أصحابها وتحديد حقوقهم ومسؤولياتهم من مهام:",["التنظيم المهني","الأخلاق المهنية","الأهداف المجتمعية","النمو المهني"],"تخضع المهنة لتنظيم مهني يؤدي هذه المهام."],
[1,"معيار «المهارات القائمة على معرفة نظرية» يعني أن مهارات المهنة تستند إلى:",["مفاهيم ومبادئ ونظريات علمية","سنوات الخبرة فقط","تقاليد متوارثة","رغبة الفرد الشخصية"],"هذه القاعدة النظرية تساعد على فهم المشكلات وتحليلها."],
[1,"ظهرت بعض الارتباطات والتنظيمات المهنية في:",["القرن الثامن عشر","القرن الخامس عشر","القرن العشرين","القرن الحادي والعشرين"],"ظهرت في الغرب ثم العالم العربي في القرن الثامن عشر."],
[1,"رغم قدم المهن وظهور التنظيمات المهنية، فإن ما تأخر ظهوره هو:",["التصنيفات المهنية","مواثيق الشرف","الأعمال المهنية للصفوة","الجامعات"],"تأخر ظهور التصنيفات المهنية عالمياً وعربياً."],
[1,"من فوائد التصنيفات المهنية للتعليم:",["تحليل العمل وتقييمه وتحديد الأجر","إلغاء التدريب المهني","منح الرخص مدى الحياة","تحديد عدد الطلاب في الصف"],"تفيد في: توحيد سياسات التعليم والتدريب، وتحليل العمل وتحديد الأجر."],
[1,"توحيد سياسات وبرامج التعليم والتوجيه والتدريب المهني يتم في ضوء:",["توصيف المهن ومعرفة الفائض والعجز فيها","رغبات الطلاب فقط","ميزانية الدولة","عدد الجامعات"],"معرفة الفائض والعجز كماً ونوعاً تمكّن المؤسسات من اتخاذ الإجراء المناسب."],
[1,"التعليم بوصفه مهنة يُعد:",["من أحدث المهن","من أقدم المهن المكتملة التمهين","حرفة لا مهنة","مهنة اكتمل تمهينها منذ العصور القديمة"],"التعليم رسالة قديمة، لكنه كمهنة من أحدث المهن ولا يزال يسعى للتمهين الكامل."],
[1,"عدد المراحل التاريخية التي مر بها التعليم ليصل إلى التمهين:",["ثلاث","اثنتان","أربع","خمس"],"ما قبل المهنية، شبه المهنية، التمهين النامي."],
[1,"الترتيب الصحيح لمراحل تمهين التعليم:",["ما قبل المهنية ← شبه المهنية ← التمهين النامي","شبه المهنية ← ما قبل المهنية ← التمهين النامي","التمهين النامي ← شبه المهنية ← ما قبل المهنية","ما قبل المهنية ← التمهين النامي ← شبه المهنية"],"احفظ الترتيب: قبل، شبه، نامٍ."],
[1,"تمتد مرحلة ما قبل المهنية حتى:",["أواخر القرن الثامن عشر","أوائل القرن العشرين","القرن الثالث قبل الميلاد","منتصف القرن التاسع عشر"],"من بداية التاريخ الإنساني حتى أواخر القرن الثامن عشر."],
[1,"عدد أطوار مرحلة ما قبل المهنية:",["ثلاثة","اثنان","أربعة","طور واحد"],"الطبيعي، الإرادي، المؤسسي."],
[1,"الطور الذي كان التعليم فيه ينتقل من الكبار للصغار تلقائياً وبطريقة غير مقصودة:",["الطور الطبيعي","الطور الإرادي","الطور المؤسسي","المرحلة شبه المهنية"],"في العصور البدائية، عبر الاحتكاك المباشر."],
[1,"في الطور الطبيعي، الاستثناء من عدم تخصص الأدوار التربوية هو:",["التربية الدينية والخلقية على أيدي الكهنة ورجال الدين","تعليم القراءة والكتابة","تعليم الحرف اليدوية","التعليم العسكري"],"لم تتخصص الأدوار التربوية إلا التربية الدينية والخلقية."],
[1,"اتصفت أساليب التربية في الطور الطبيعي بـ:",["العفوية والتلقين المباشر","التنظيم والتخصص","الاعتماد على الكتابة","الإشراف الحكومي"],"تربية عفوية وتلقين مباشر."],
[1,"أهم ما يميز الطور الإرادي للتعليم:",["نشأة الكتابة وتقدمها","ظهور المدرس المتخصص","ظهور تنظيمات تخدم المهنة","انتقال الاهتمام إلى المتعلم"],"لم يعد التقليد واللغة الشفوية الوسيلتين الوحيدتين للتعليم."],
[1,"ظهر الطور الإرادي مع تنامي:",["الحضارات القديمة كالمصرية والصينية والإغريقية والرومانية","عصر النهضة الأوروبية","الثورة الصناعية","العصر الحديث"],"ظهر فيها التخصص وتقسيم الأعمال."],
[1,"النخبة المثقفة التي اضطلعت بالأعمال التربوية عند قدماء المصريين:",["الكهنة","الفلاسفة","القادة","الشعراء"],"الكهنة (مصر)، القادة (الصين)، الفلاسفة والشعراء (الإغريق)."],
[1,"النخبة التي تولت التربية عند الصينيين:",["القادة","الكهنة","الفلاسفة","التجار"],"القادة عند الصينيين."],
[1,"النخبة التي تولت التربية عند الإغريق:",["الفلاسفة والشعراء","الكهنة","القادة العسكريون","رجال الدولة"],"الفلاسفة والشعراء عند الإغريق."],
[1,"في الطور الإرادي، ظهر ما يشبه التعليم المدرسي بشكل:",["اجتهادي وغير منظم","منظم في سلم تعليمي متميز المراحل","إلزامي تشرف عليه الدولة","جامعي متخصص"],"ولم ينتظم في سلم تعليمي، ولم يكن مسؤولية الدولة."],
[1,"التعليم لم يكن مسؤولية الدولة في:",["الطور الإرادي","المرحلة شبه المهنية","مرحلة التمهين النامي","العصر الحديث"],"نص المقرر على ذلك في الطور الإرادي."],
[1,"بدأ الطور المؤسسي للتعليم مع:",["أوائل القرن الثالث قبل الميلاد","أوائل القرن التاسع عشر","بدايات القرن العشرين","أواخر القرن الثامن عشر"],"ويمتد إلى بداية العصور الحديثة."],
[1,"ظهور المدرس المتخصص في المادة أو المدرسة أو المرحلة سمة:",["الطور المؤسسي","الطور الإرادي","الطور الطبيعي","المرحلة شبه المهنية"],"احذر الخلط: الكتابة للإرادي، والمدرس المتخصص للمؤسسي."],
[1,"في الطور المؤسسي، عملت بعض المعابد المصرية القديمة كـ:",["جامعات","مدارس أولية","نقابات للمعلمين","مراكز تدريب"],"ظهرت بعض المعابد المصرية التي عملت كجامعات."],
[1,"معلمو التعليم الأولي في الطور المؤسسي اختصوا بـ:",["القراءة والكتابة وتحفيظ النصوص الدينية","الفلسفة والمنطق","العلوم والرياضيات المتقدمة","الإدارة التعليمية"],"ولم يتمتعوا بمكانة مهنية عالية أو إعداد عالٍ."],

[3,"أسلوب تنظيم جلوس المتعلمين ونماذج دراسة الحالة المشاغبة دليل على معيار:",["إدارة الصف","التخطيط","الإلمام بالمادة","البحث التربوي"],"مثال المقرر لمعيار إدارة الصف."],

[3,"وكيل مدرسة رُشّح ليصبح مديراً، أنسب برنامج له:",["برامج الترقي","برامج العلاج","برامج التأهيل","برامج التجديد"],"لتعريفه بمتطلبات العمل الجديد."],
[3,"معلم لوحظ عليه قصور في ضبط الصف خلال زيارة تقويمية، أنسب برنامج له:",["برامج العلاج","برامج الترقي","برامج التجديد","برامج التأهيل"],"العلاج للتغلب على أوجه القصور."]
];

let topic=0, deck=[], i=0, ok=0, bad=0, wrong=[], answered=false;
const $=id=>document.getElementById(id);
const L=["أ","ب","ج","د"];
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const ar=n=>n.toLocaleString("ar-EG");

function build(list){
  deck=shuffle(list).map(x=>{const o=shuffle(x[2].map((t,k)=>({t,c:k===0})));return{tp:x[0],q:x[1],o,e:x[3]}});
  i=0;ok=0;bad=0;wrong=[];render();
}
function pool(){return Q.filter(x=>!topic||x[0]===topic)}
function meta(){const c={1:0,2:0,3:0};Q.forEach(x=>c[x[0]]++);$("meta").textContent=`${ar(Q.length)} سؤالاً · الموضوع الأول ${ar(c[1])} · الثاني ${ar(c[2])} · الثالث ${ar(c[3])}`}
function status(){
  $("pos").textContent=`${ar(Math.min(i+1,deck.length))} / ${ar(deck.length)}`;
  $("fill").style.width=(deck.length?(i/deck.length*100):0)+"%";
  $("ok").textContent=ar(ok);$("bad").textContent=ar(bad);
}
function render(){
  answered=false;status();
  if(i>=deck.length){return finish()}
  const d=deck[i];
  $("card").className="card";
  $("card").innerHTML=`<div class="qhead"><span>سؤال ${ar(i+1)}</span><span class="tag">${T[d.tp]}</span></div>
  <p class="q">${d.q}</p>
  <div class="opts">${d.o.map((o,k)=>`<button class="opt" id="o${k}" data-k="${k}"><span class="l">${L[k]}</span><span>${o.t}</span></button>`).join("")}</div>
  <div id="exp"></div>
  <div class="actions"><button class="btn ghost" id="skip">تخطَّ</button><button class="btn" id="next" disabled>التالي</button></div>`;
  $("card").querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $("next").onclick=()=>{i++;render()};
  $("skip").onclick=()=>{if(!answered){wrong.push(deck[i])}i++;render()};
}
function pick(k){
  if(answered)return;answered=true;
  const d=deck[i];
  d.o.forEach((o,j)=>{const b=$("o"+j);b.disabled=true;if(o.c)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  if(d.o[k].c){ok++}else{bad++;wrong.push(d)}
  $("exp").innerHTML=`<div class="exp"><strong>${d.o[k].c?"إجابة صحيحة":"الإجابة الصحيحة: "+d.o.find(o=>o.c).t}</strong>${d.e}</div>`;
  $("skip").disabled=true;$("next").disabled=false;$("next").focus();status();
}
function finish(){
  const n=deck.length,p=n?Math.round(ok/n*100):0;
  const g=p>=90?"ممتاز، أنت جاهز للاختبار":p>=75?"جيد جداً، راجع أخطاءك فقط":p>=60?"مقبول، تحتاج مراجعة الملخص":"راجع الملخص ثم أعد المحاولة";
  $("fill").style.width="100%";
  $("card").className="card result";
  $("card").innerHTML=`<span class="eyebrow">النتيجة النهائية</span>
  <div class="big">${ar(p)}٪</div>
  <div>صح ${ar(ok)} من ${ar(n)}</div>
  <div class="grade">${g}</div>
  <div class="actions">${wrong.length?`<button class="btn" id="redo">أعد الأخطاء فقط (${ar(wrong.length)})</button>`:""}<button class="btn ghost" id="again">ابدأ من جديد</button></div>`;
  if(wrong.length)$("redo").onclick=()=>{const w=wrong.map(d=>[d.tp,d.q,[d.o.find(o=>o.c).t,...d.o.filter(o=>!o.c).map(o=>o.t)],d.e]);build(w)};
  $("again").onclick=start;
}
function avail(){
  const n=pool().length;$("cnt").max=n;
  const all=document.querySelector('.cn[data-n="0"]');
  if(all.getAttribute("aria-pressed")==="true")$("cnt").value=n;
  $("avail").textContent=`المتاح في هذا الاختيار: ${ar(n)} سؤالاً`;
}
function start(){
  const p=pool();let n=parseInt($("cnt").value,10);
  if(!n||n<1)n=p.length;n=Math.min(n,p.length);$("cnt").value=n;
  build(shuffle(p).slice(0,n));
  $("card").scrollIntoView({behavior:"smooth",block:"start"});
}
document.querySelectorAll(".filters .chip").forEach(c=>c.onclick=()=>{
  topic=+c.dataset.t;document.querySelectorAll(".filters .chip").forEach(x=>x.setAttribute("aria-pressed",x===c));avail();
});
document.querySelectorAll(".cn").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".cn").forEach(x=>x.setAttribute("aria-pressed",x===c));
  const v=+c.dataset.n;$("cnt").value=v||pool().length;
});
$("cnt").oninput=()=>document.querySelectorAll(".cn").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.n===+$("cnt").value));
$("start").onclick=start;
meta();avail();build(shuffle(pool()).slice(0,20));
</script>
